name: documenso

services:
  database:
    image: postgres:15
    container_name: documenso-postgres
    restart: unless-stopped
    env_file:
      - ./stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - documenso_postgres_data:/var/lib/postgresql/data

  documenso:
    image: ghcr.io/documenso/documenso:v2.18.0
    container_name: documenso
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./stack.env
    environment:
      PORT: 3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "3020:3000"
    volumes:
      - ${DOCUMENSO_CERT_HOST_PATH:?err}:/opt/documenso/cert.p12:ro
    networks:
      - default
      - caddy
    labels:
      # http:// is explicit: a bare hostname makes Caddy attempt ACME, which
      # cannot succeed for .lan and leaves the route dead.
      #
      # Documenso builds absolute URLs from NEXT_PUBLIC_WEBAPP_URL, so this
      # hostname is for reaching the UI, not a second canonical origin — signing
      # links keep pointing at sign.builtbybrendan.com.
      - "caddy=http://documenso.svc.lan"
      - "caddy.reverse_proxy={{upstreams 3000}}"

networks:
  caddy:
    external: true
    name: caddy

volumes:
  documenso_postgres_data:
